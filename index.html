<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#b49c82" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>ManagerCAL – Quản lý kiểm định</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <!-- Cấu hình máy chủ lúc chạy: sửa public/config.js (hoặc dist/config.js) mà không cần build lại -->
    <script src="./config.js"></script>
    <!-- đặt chủ đề sáng/tối trước khi vẽ để không nháy -->
    <script>try{var t=localStorage.getItem("managercal.theme");if(t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
